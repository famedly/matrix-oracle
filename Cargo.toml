[package]
name = "matrix-oracle"
version = "0.2.0"
description = ".well-known resolver for the matrix protocol"
authors = ["Amanda Graven <amanda@graven.dev"]
readme = "README.md"
repository = "https://github.com/famedly/matrix-oracle"
license = "AGPL-3.0-only"
keywords = ["matrix"]
categories = ["api-bindings"]
edition = "2024"
rust-version = "1.88"
resolver = "3"

[features]
default = ["rustls", "client", "server"]
## Enable client-server well-known resolution
client = ["url"]
## Enable server-server well-known resolution
server = ["hickory-resolver"]
## Use rustls for TLS (reqwest)
rustls = ["reqwest/rustls-tls"]
## Use openssl/native-tls for TLS (reqwest)
native-tls = ["reqwest/native-tls"]

[dependencies]
document-features = "0.2"
http-cache-reqwest = { version = "0.16", default-features = false, features = ["manager-moka"] }
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
reqwest-middleware = "0.4"
tracing = "0.1"
hickory-resolver = { version = "0.26", optional = true }
url = { version = "2.2", optional = true }

[dev-dependencies]
tokio = { version = "1.12", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
proptest = "1"

[package.metadata.cargo-udeps.ignore]
normal = ["document-features"]
